name: Nightly Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
  RELEASE_TARGET: aarch64-apple-darwin
  RELEASE_ARCHIVE: modern-format-boost-aarch64-apple-darwin.tar.gz
  MIGRATED_RUST_BINS: "backfill_directory_scores cache_cleaner check_all collect_optimized create_live_photo database_manager generate_test_media icloud_import install_deps mfb_rust_toolchain normalize_stale_embed_measurement_slots post_training_closure run_training sandbox_validate session_audit setup_private_db start_training_four training_pipeline delivery_heatmap corpus_thresholds smart_build"

jobs:
  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-16
          targets: aarch64-apple-darwin

      - name: Install dependencies (Homebrew)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /usr/local/Homebrew/Library/Taps/hashicorp \
                 /usr/local/Homebrew/Library/Taps/aws \
                 /opt/homebrew/Library/Taps/hashicorp \
                 /opt/homebrew/Library/Taps/aws

          BREW_FORMULAS=(
            ffmpeg jpeg-xl exiftool exiv2 jpeginfo pngcheck jhead jpeg-turbo libavif imagemagick webp libheif nasm dav1d
            gmp mpfr libmpc vvdec vvenc
          )
          MISSING=()
          for formula in "${BREW_FORMULAS[@]}"; do
            if ! brew list --formula "${formula}" &>/dev/null; then
              MISSING+=("${formula}")
            fi
          done
          if ((${#MISSING[@]} > 0)); then
            brew update
            brew install "${MISSING[@]}"
          else
            echo "All required Homebrew formulas already installed."
          fi

          BREW_PREFIX=$(brew --prefix)
          BREW_LIBS="${BREW_PREFIX}/lib"
          for pkg in x264 vvdec vvenc; do
            if [ -d "${BREW_PREFIX}/opt/${pkg}/lib" ]; then
              BREW_LIBS="${BREW_PREFIX}/opt/${pkg}/lib:${BREW_LIBS}"
            fi
          done
          {
            echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/opt/dav1d/lib/pkgconfig:${BREW_PREFIX}/opt/jpeg-xl/lib/pkgconfig"
            echo "CPATH=${BREW_PREFIX}/include${CPATH:+:$CPATH}"
            echo "LIBRARY_PATH=${BREW_LIBS}${LIBRARY_PATH:+:$LIBRARY_PATH}"
          } >> "$GITHUB_ENV"

      - name: Workaround for stdc++ on macOS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/.tmp_lib
          SDK_PATH=$(xcrun --show-sdk-path)
          ln -sf "${SDK_PATH}/usr/lib/libc++.tbd" target/.tmp_lib/libstdc++.tbd
          ln -sf "${SDK_PATH}/usr/lib/libc++.tbd" target/.tmp_lib/libstdc++.dylib
          echo "LIBRARY_PATH=$(pwd)/target/.tmp_lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "$RELEASE_TARGET" -p img -p vid \
            --features "img/system-gmp,vid/system-gmp,foundation/system-gmp"
          DEV_BIN_ARGS=()
          for bin in ${MIGRATED_RUST_BINS}; do
            DEV_BIN_ARGS+=(--bin "${bin}")
          done
          cargo build --locked --release --target "$RELEASE_TARGET" -p dev "${DEV_BIN_ARGS[@]}"

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${RELEASE_TARGET}/release/img" dist/
          cp "target/${RELEASE_TARGET}/release/vid" dist/
          for bin in ${MIGRATED_RUST_BINS}; do
            cp "target/${RELEASE_TARGET}/release/${bin}" dist/
          done
          mkdir -p dist/crates/dev/scripts
          cp crates/dev/scripts/{quality_regression_model.py,loop_intent_clustering.py,fastmode_paths.py} \
            dist/crates/dev/scripts/
          cp LICENSE README.md docs/CHANGELOG.md dist/
          tar -C dist -czf "$RELEASE_ARCHIVE" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: modern-format-boost-aarch64-apple-darwin
          path: modern-format-boost-aarch64-apple-darwin.tar.gz
          if-no-files-found: error

  publish:
    name: Publish Nightly Release
    needs: build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Move nightly tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly-latest "${GITHUB_SHA}"
          git push origin refs/tags/nightly-latest --force

      - name: Create release notes
        shell: bash
        run: |
          printf '%s\n' \
            "Automated Apple Silicon nightly build for \`${GITHUB_SHA}\`." \
            "" \
            "Source branch: \`${GITHUB_REF_NAME}\`" \
            "Run: \`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\`" \
            > /tmp/nightly_release_notes.md

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-latest
          name: Nightly Build
          body_path: /tmp/nightly_release_notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
          token: ${{ secrets.GITHUB_TOKEN }}
