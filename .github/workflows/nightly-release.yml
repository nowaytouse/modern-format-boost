name: Nightly Release

on:
  push:
    branches: [nightly]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    name: Build (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            os: macos-latest
          - arch: x86_64
            target: x86_64-apple-darwin
            os: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Homebrew)
        run: |
          brew update
          brew install ffmpeg jpeg-xl exiftool imagemagick webp libheif nasm dav1d gmp mpfr libmpc || true
          BREW_PREFIX=$(brew --prefix)
          echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/opt/dav1d/lib/pkgconfig:${BREW_PREFIX}/opt/jpeg-xl/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CPATH=${BREW_PREFIX}/include${CPATH:+:$CPATH}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${BREW_PREFIX}/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Workaround for stdc++ on macOS
        run: |
          # libstdc++ is not shipped on modern macOS; redirect it to libc++ via .tbd stub
          mkdir -p .tmp_lib
          SDK_PATH=$(xcrun --show-sdk-path)
          ln -sf "${SDK_PATH}/usr/lib/libc++.tbd" .tmp_lib/libstdc++.tbd
          ln -sf "${SDK_PATH}/usr/lib/libc++.tbd" .tmp_lib/libstdc++.dylib
          echo "LIBRARY_PATH=$(pwd)/.tmp_lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} -p img -p vid \
            --features img/system-gmp,vid/system-gmp,shared_utils/system-gmp

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/img dist/
          cp target/${{ matrix.target }}/release/vid dist/
          cp -r crates/dev/scripts dist/
          cp LICENSE README.md docs/CHANGELOG.md dist/
          cd dist
          tar czf ../modern-format-boost-${{ matrix.target }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modern-format-boost-${{ matrix.target }}
          path: modern-format-boost-${{ matrix.target }}.tar.gz
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pkg-config clang cmake nasm ninja-build meson \
            libde265-dev libx265-dev libaom-dev \
            libturbojpeg0-dev libpng-dev \
            libgmp-dev libmpfr-dev libmpc-dev \
            curl build-essential
          
          # Install cross-compilation tools for macOS builds on Linux
          sudo apt-get install -y gcc-x86-64-linux-gnu g++-x86-64-linux-gnu
          
          # Set up cross-compilation environment
          echo "CC_x86_64-unknown-linux-gnu=x86_64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_x86_64-unknown-linux-gnu=x86_64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"

          # dav1d >= 1.3.0 required by dav1d-sys; Ubuntu 22.04 ships 0.9.2.
          # Build dav1d 1.5.1 from source with retry logic
          cd /tmp
          for i in {1..3}; do
            curl -fsSL https://code.videolan.org/videolan/dav1d/-/archive/1.5.1/dav1d-1.5.1.tar.gz \
              -o dav1d.tar.gz && break || sleep 10
          done
          tar xzf dav1d.tar.gz
          cd dav1d-1.5.1
          meson setup build --buildtype=release --prefix=/usr/local -Denable_tools=false -Denable_tests=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

          # libheif >= 1.21 required by libheif-rs 2.7; Ubuntu 22.04 ships 1.12.
          # Build libheif 1.21.0 from source with retry logic
          cd /tmp
          for i in {1..3}; do
            curl -fsSL https://github.com/strukturag/libheif/releases/download/v1.21.0/libheif-1.21.0.tar.gz \
              -o libheif.tar.gz && break || sleep 10
          done
          tar xzf libheif.tar.gz
          cd libheif-1.21.0
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DWITH_EXAMPLES=OFF \
            -DWITH_TESTING=OFF
          cmake --build build --parallel
          sudo cmake --install build
          sudo ldconfig

          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu -p img -p vid \
            --features img/system-gmp,vid/system-gmp,shared_utils/system-gmp

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/img dist/
          cp target/x86_64-unknown-linux-gnu/release/vid dist/
          cp -r crates/dev/scripts dist/
          cp LICENSE README.md docs/CHANGELOG.md dist/
          cd dist
          tar czf ../modern-format-boost-x86_64-unknown-linux-gnu.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modern-format-boost-linux-x64
          path: modern-format-boost-x86_64-unknown-linux-gnu.tar.gz
