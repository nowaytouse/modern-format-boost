name: Nightly Release

on:
  push:
    branches: [nightly]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: Build (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            os: macos-latest
          - arch: x86_64
            target: x86_64-apple-darwin
            os: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Homebrew)
        run: |
          brew install ffmpeg jpeg-xl exiftool imagemagick webp libheif nasm dav1d
          BREW_PREFIX=$(brew --prefix)
          echo "PKG_CONFIG_PATH=${BREW_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/opt/dav1d/lib/pkgconfig:${BREW_PREFIX}/opt/jpeg-xl/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Workaround for stdc++ on macOS
        run: |
          # Use system libc++ instead of libstdc++ to avoid linking issues
          mkdir -p .tmp_lib
          SDK_PATH=$(xcrun --show-sdk-path)
          ln -sf "${SDK_PATH}/usr/lib/libc++.tbd" .tmp_lib/libstdc++.tbd
          ln -sf /usr/lib/libc++.dylib .tmp_lib/libstdc++.dylib

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p img -p vid

      - name: Package binaries
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/img dist/
          cp target/${{ matrix.target }}/release/vid dist/
          cp -r crates/dev/scripts dist/
          cp LICENSE README.md CHANGELOG.md dist/
          cd dist
          tar czf ../modern-format-boost-${{ matrix.target }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modern-format-boost-${{ matrix.target }}
          path: modern-format-boost-${{ matrix.target }}.tar.gz
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
