name: ClusterFuzzLite
on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  schedule:
    - cron: "0 0 * * *" # Daily

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  PR:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          storage-repo: https://github.com/${{ github.repository }}
          storage-repo-branch: clusterfuzzlite-data
          sanitizer: address
        env:
          # Disable libjxl internal fuzzers to avoid sanitizer conflicts
          JPEGXL_CMAKE_FLAGS: "-DJPEGXL_ENABLE_FUZZERS=OFF"
          # Point to the correct output directory where ClusterFuzzLite expects fuzz targets
          OUT: ${{ github.workspace }}/build-out
          # Use stable Rust for better compatibility
          RUST_TOOLCHAIN: stable
        continue-on-error: false
      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzzing-seconds: 600
          mode: "pr"
          storage-repo: https://github.com/${{ github.repository }}
          storage-repo-branch: clusterfuzzlite-data
          sanitizer: address
        continue-on-error: false

  Batch:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-batch-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          storage-repo: https://github.com/${{ github.repository }}
          storage-repo-branch: clusterfuzzlite-data
          sanitizer: address
        env:
          # Disable libjxl internal fuzzers to avoid sanitizer conflicts
          JPEGXL_CMAKE_FLAGS: "-DJPEGXL_ENABLE_FUZZERS=OFF"
          # Point to the correct output directory where ClusterFuzzLite expects fuzz targets
          OUT: ${{ github.workspace }}/build-out
          # Use stable Rust for better compatibility
          RUST_TOOLCHAIN: stable
        continue-on-error: false
      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzzing-seconds: 3600
          mode: "batch"
          storage-repo: https://github.com/${{ github.repository }}
          storage-repo-branch: clusterfuzzlite-data
          sanitizer: address
        continue-on-error: false
