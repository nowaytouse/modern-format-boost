name: ClusterFuzzLite
on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  schedule:
    - cron: "0 0 * * *" # Daily

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  PR:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Create output directory symlink
        run: |
          # Create both directories
          mkdir -p ${{ github.workspace }}/build-out
          mkdir -p ${{ github.workspace }}/out
          
          # After build, copy targets to both locations
          echo "Will copy fuzz targets to both build-out and out directories"
      - name: Build Fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          storage-repo: https://github.com/${{ github.repository }}
          storage-repo-branch: clusterfuzzlite-data
          sanitizer: address
          dry-run: false
        env:
          # Disable libjxl internal fuzzers to avoid sanitizer conflicts
          JPEGXL_CMAKE_FLAGS: "-DJPEGXL_ENABLE_FUZZERS=OFF"
          # Use nightly Rust for specialization/SIMD support
          RUST_TOOLCHAIN: nightly
          # Keep all fuzz targets regardless of diff
          CFL_KEEP_ALL_FUZZERS: "true"
      - name: Copy fuzz targets to both directories
        run: |
          # Copy from build-out to out directory
          if [ -d "${{ github.workspace }}/build-out" ]; then
            cp -r ${{ github.workspace }}/build-out/* ${{ github.workspace }}/out/
            echo "Copied fuzz targets to out directory"
            ls -la ${{ github.workspace }}/out/
          else
            echo "build-out directory not found"
          fi
        continue-on-error: false
      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzzing-seconds: 600
          mode: "pr"
          storage-repo: https://github.com/${{ github.repository }}
          storage-repo-branch: clusterfuzzlite-data
          sanitizer: address
        continue-on-error: false

  Batch:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-batch-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1
        with:
          fetch-depth: 0
      - name: Create output directory symlink
        run: |
          # Create both directories
          mkdir -p ${{ github.workspace }}/build-out
          mkdir -p ${{ github.workspace }}/out
          
          # After build, copy targets to both locations
          echo "Will copy fuzz targets to both build-out and out directories"
      - name: Build Fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
          storage-repo: https://github.com/${{ github.repository }}
          storage-repo-branch: clusterfuzzlite-data
          sanitizer: address
          dry-run: false
        env:
          # Disable libjxl internal fuzzers to avoid sanitizer conflicts
          JPEGXL_CMAKE_FLAGS: "-DJPEGXL_ENABLE_FUZZERS=OFF"
          # Use nightly Rust for specialization/SIMD support
          RUST_TOOLCHAIN: nightly
          # Keep all fuzz targets regardless of diff
          CFL_KEEP_ALL_FUZZERS: "true"
      - name: Copy fuzz targets to both directories
        run: |
          # Copy from build-out to out directory
          if [ -d "${{ github.workspace }}/build-out" ]; then
            cp -r ${{ github.workspace }}/build-out/* ${{ github.workspace }}/out/
            echo "Copied fuzz targets to out directory"
            ls -la ${{ github.workspace }}/out/
          else
            echo "build-out directory not found"
          fi
        continue-on-error: false
      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzzing-seconds: 3600
          mode: "batch"
          storage-repo: https://github.com/${{ github.repository }}
          storage-repo-branch: clusterfuzzlite-data
          sanitizer: address
        continue-on-error: false
