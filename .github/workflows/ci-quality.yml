name: Continuous Quality & Fuzzing

on:
  push:
    branches: [main, nightly]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main, nightly]
  schedule:
    - cron: "0 0 * * *" # Daily at midnight
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  pull-requests: write

concurrency:
  group: maintenance-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

jobs:
  # ── Blocking pipeline: each job needs the previous; first failure stops the chain ──

  validation:
    name: "1 · Configuration & Workflow Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.39.0"

      - name: Verify justfile recipes
        id: just
        continue-on-error: true
        run: just --list

      - name: Install actionlint & yamllint
        run: |
          # Build actionlint directly; do not execute downloaded installer scripts.
          go version
          GOBIN="$RUNNER_TEMP/actionlint-bin" go install github.com/rhysd/actionlint/cmd/actionlint@latest
          sudo install -m 0755 "$RUNNER_TEMP/actionlint-bin/actionlint" /usr/local/bin/actionlint

          # Install yamllint via apt to avoid PEP 668 issues on Ubuntu 24.04
          sudo apt-get update -qq
          sudo apt-get install -y yamllint

      - name: Validate workflow files
        id: actionlint
        continue-on-error: true
        run: actionlint -color

      - name: Check YAML syntax
        id: yamllint
        continue-on-error: true
        run: |
          YAMLLINT_CONFIG='{extends: relaxed, rules: {document-start: disable, truthy: disable, comments: disable, line-length: disable}}'
          find .github/workflows \( -name "*.yml" -o -name "*.yaml" \) -print0 | \
            xargs -0 -n1 yamllint -d "$YAMLLINT_CONFIG"

      - name: Check validation outcomes
        if: always()
        run: |
          exit_code=0
          if [ "${{ steps.just.outcome }}" = "failure" ]; then
            echo "::error::just --list failed"
            exit_code=1
          fi
          if [ "${{ steps.actionlint.outcome }}" = "failure" ]; then
            echo "::error::actionlint failed"
            exit_code=1
          fi
          if [ "${{ steps.yamllint.outcome }}" = "failure" ]; then
            echo "::error::yamllint failed"
            exit_code=1
          fi
          exit $exit_code

  dispatch2-macos:
    name: "1b · dispatch2 (macOS / libdispatch)"
    needs: validation
    if: ${{ !cancelled() }}
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test dispatch2
        working-directory: crates/dev/dispatch2
        run: cargo test --no-fail-fast -- --test-threads=1

  dispatch2-linux:
    name: "1c · dispatch2 (Linux / swift-corelibs-libdispatch)"
    needs: validation
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libssl-dev build-essential cmake git clang libblocksruntime-dev pkg-config ninja-build nasm meson
          cd /tmp
          curl -fsSL "https://github.com/strukturag/libheif/releases/download/v1.23.1/libheif-1.23.1.tar.gz" -o libheif-src.tar.gz
          tar xzf libheif-src.tar.gz
          cd libheif-1.23.1
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DCMAKE_WARN_DEPRECATED=OFF \
            -DWITH_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF \
            -DWITH_OPENH264=OFF \
            > /tmp/libheif-cmake.log 2>&1
          cmake --build build --parallel
          sudo cmake --install build
          sudo ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/x86_64-linux-gnu/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build libdispatch
        env:
          LIBDISPATCH_REF: release/6.0
        run: cargo run --locked -p dev --bin build_libdispatch

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test dispatch2 (no objc2; Linux libdispatch)
        working-directory: crates/dev/dispatch2
        env:
          LIBDISPATCH_PREFIX: /usr/local
          LD_LIBRARY_PATH: /usr/local/lib
          CC: clang
          CXX: clang++
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
        run: cargo test --no-default-features --features "std,libc,alloc" --no-fail-fast -- --test-threads=1

  # Keep package-level signals separate from the shared workspace audit. A
  # failing video path must not hide whether IMG itself is healthy (and vice
  # versa); both jobs still use the same pinned toolchain and static media
  # dependency boundary.
  package-quality:
    name: "${{ matrix.name }}"
    needs: validation
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: img
            name: "2a · IMG package quality"
          - package: vid
            name: "2b · VID package quality"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LIBHEIF_STATIC: "1"
      LIBHEIF_SYS_STATIC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Install media build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential clang cmake libssl-dev meson nasm ninja-build pkg-config \
            libavif-bin libimage-exiftool-perl libjxl-tools ffmpeg \
            imagemagick libjpeg-turbo-progs webp unzip

      - name: Install pinned modern libjxl CLI tools for IMG
        if: matrix.package == 'img'
        env:
          LIBJXL_VERSION: v0.12.0
          LIBJXL_ARCHIVE_SHA256: 5318a1ea40adad76d023e0c17a03d4627f8282f83cb2b575e69be8e74f1ff456
        run: |
          set -euo pipefail
          sudo apt-get install -y lzip
          archive="$RUNNER_TEMP/jxl-linux-x86_64-static.tar.lz"
          tools_root="$RUNNER_TEMP/libjxl-static"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/libjxl/libjxl/releases/download/${LIBJXL_VERSION}/jxl-linux-x86_64-static.tar.lz" \
            -o "$archive"
          printf '%s  %s\n' "$LIBJXL_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$tools_root"
          lzip -dc "$archive" | tar -xf - -C "$tools_root"
          for tool in cjxl djxl jxlinfo; do
            test -x "$tools_root/tools/$tool"
            sudo install -m 0755 "$tools_root/tools/$tool" "/usr/local/bin/$tool"
          done
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          test "$(command -v djxl)" = "/usr/local/bin/djxl"
          djxl_help="$(djxl -h 2>&1)"
          grep -q -- "--output_format" <<< "$djxl_help"
          djxl_version="$(djxl --version 2>&1)"
          grep -q -- "v0.12.0" <<< "$djxl_version"
          printf '%s\n' "$djxl_version"

      # Keep the local development policy (HEAD/nightly where available)
      # separate from CI: IMG uses checksum-pinned, non-prerelease releases so
      # a runner cannot silently fall back to an obsolete distro CLI.
      - name: Install pinned stable IMG media toolchain
        if: matrix.package == 'img'
        env:
          LIBAVIF_TAG: v1.4.2
          LIBAVIF_VERSION: 1.4.2
          LIBAVIF_ARCHIVE_SHA256: faf58a670ffbfdc0e3559e6d37592cff277c447dd39453f1cd1d7d7f5a20b8ef
          IMAGEMAGICK_VERSION: 7.1.2-30
          IMAGEMAGICK_ARCHIVE_SHA256: 372af8a3fd61ef5f15c6331cde3e21f840eb165d8b533f34ed05d68736dd682e
          EXIFTOOL_VERSION: '13.59'
          EXIFTOOL_ARCHIVE_SHA256: 87d3317882fdae9cb4dcfe57a96a378d0132ffc02c731315bf128b19ddcf7aac
          LIBJPEG_TURBO_VERSION: 3.2.0
          LIBJPEG_TURBO_ARCHIVE_SHA256: 6f30092cef9fb839779646608f4ee14ae3cbac989c47fa05e841b0841f09878e
        run: |
          set -euo pipefail
          tools_root="$RUNNER_TEMP/mfb-img-tools"
          mkdir -p "$tools_root"

          # Official libavif release artifact (statically linked avifenc/avifdec).
          libavif_archive="$tools_root/libavif-linux.zip"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/AOMediaCodec/libavif/releases/download/${LIBAVIF_TAG}/linux-artifacts.zip" \
            -o "$libavif_archive"
          printf '%s  %s\n' "$LIBAVIF_ARCHIVE_SHA256" "$libavif_archive" | sha256sum --check -
          mkdir -p "$tools_root/libavif"
          unzip -q "$libavif_archive" -d "$tools_root/libavif"
          for tool in avifenc avifdec; do
            test -x "$tools_root/libavif/$tool"
            sudo install -m 0755 "$tools_root/libavif/$tool" "/usr/local/bin/$tool"
          done

          # Official ImageMagick AppImage avoids Ubuntu's legacy IM6 command
          # surface while keeping a stable, reproducible IM7 binary in CI.
          imagemagick_archive="$tools_root/imagemagick.AppImage"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/ImageMagick/ImageMagick/releases/download/${IMAGEMAGICK_VERSION}/ImageMagick-${IMAGEMAGICK_VERSION}-gcc-x86_64.AppImage" \
            -o "$imagemagick_archive"
          printf '%s  %s\n' "$IMAGEMAGICK_ARCHIVE_SHA256" "$imagemagick_archive" | sha256sum --check -
          chmod +x "$imagemagick_archive"
          (cd "$tools_root" && "$imagemagick_archive" --appimage-extract >/dev/null)
          magick_root="$tools_root/squashfs-root"
          test -x "$magick_root/AppRun"
          magick_wrapper="$tools_root/magick-wrapper"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            "cd \"$magick_root\"" \
            'exec ./AppRun "$@"' > "$magick_wrapper"
          sudo install -m 0755 "$magick_wrapper" /usr/local/bin/magick

          # Official ExifTool release; keep its bundled Perl library adjacent
          # to the launcher instead of mixing it with the distro module tree.
          exiftool_archive="$tools_root/exiftool-${EXIFTOOL_VERSION}.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/exiftool/exiftool/archive/refs/tags/${EXIFTOOL_VERSION}.tar.gz" \
            -o "$exiftool_archive"
          printf '%s  %s\n' "$EXIFTOOL_ARCHIVE_SHA256" "$exiftool_archive" | sha256sum --check -
          tar -xzf "$exiftool_archive" -C "$tools_root"
          exiftool_root="$tools_root/exiftool-${EXIFTOOL_VERSION}"
          test -x "$exiftool_root/exiftool"
          exiftool_wrapper="$tools_root/exiftool-wrapper"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'set -euo pipefail' \
            "export PERL5LIB=\"$exiftool_root/lib\${PERL5LIB:+:\$PERL5LIB}\"" \
            "exec \"$exiftool_root/exiftool\" \"\$@\"" > "$exiftool_wrapper"
          sudo install -m 0755 "$exiftool_wrapper" /usr/local/bin/exiftool

          # Build the official libjpeg-turbo release so jpegtran is not tied to
          # the runner's potentially stale distro utility package.
          jpeg_archive="$tools_root/libjpeg-turbo-${LIBJPEG_TURBO_VERSION}.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${LIBJPEG_TURBO_VERSION}/libjpeg-turbo-${LIBJPEG_TURBO_VERSION}.tar.gz" \
            -o "$jpeg_archive"
          printf '%s  %s\n' "$LIBJPEG_TURBO_ARCHIVE_SHA256" "$jpeg_archive" | sha256sum --check -
          tar -xzf "$jpeg_archive" -C "$tools_root"
          cmake -S "$tools_root/libjpeg-turbo-${LIBJPEG_TURBO_VERSION}" \
            -B "$tools_root/libjpeg-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DENABLE_SHARED=OFF \
            -DWITH_TURBOJPEG=OFF \
            -DWITH_SIMD=ON \
            -DENABLE_TESTING=OFF
          cmake --build "$tools_root/libjpeg-build" --parallel 2
          sudo cmake --install "$tools_root/libjpeg-build"

          # ffmpeg/ffprobe remain the Ubuntu formal-release pair (upstream does
          # not publish portable official binaries); assert the codec contract
          # used by the shared IMG foundation instead of accepting a stub.
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -h encoder=libx265 >/dev/null
          ffprobe -version >/dev/null

          for tool in avifenc avifdec magick exiftool jpegtran ffmpeg ffprobe; do
            printf '[IMG tool] %s -> ' "$tool"
            case "$tool" in
              exiftool) exiftool -ver ;;
              jpegtran) jpegtran -version ;;
              *) "$tool" --version 2>&1 | head -1 ;;
            esac
          done
          avifenc --version 2>&1 | grep -F "$LIBAVIF_VERSION"
          avifdec --version 2>&1 | grep -F "$LIBAVIF_VERSION"
          magick -version 2>&1 | grep -F "ImageMagick ${IMAGEMAGICK_VERSION}"
          exiftool -ver | grep -Fx "$EXIFTOOL_VERSION"
          jpegtran -version 2>&1 | grep -F "libjpeg-turbo version ${LIBJPEG_TURBO_VERSION}"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-09
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ matrix.package }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.package }}-

      - name: Check ${{ matrix.package }} compilation
        run: cargo check --locked -p ${{ matrix.package }} --all-targets --features foundation/ci-static-build

      - name: Check ${{ matrix.package }} clippy
        run: cargo clippy --locked -p ${{ matrix.package }} --all-targets --features foundation/ci-static-build -- -D warnings

      - name: Test ${{ matrix.package }}
        run: cargo test --locked -p ${{ matrix.package }} --all-targets --features foundation/ci-static-build -- --test-threads=1

  health-check:
    name: "2c · Shared Repository Health Check"
    needs: validation
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # A cold fuzz/libheif build can push the full check beyond two hours on hosted runners.
    timeout-minutes: 180
    env:
      # Match ClusterFuzzLite / fuzz: embedded libheif avoids libheif-sys build.rs PermissionDenied on runners.
      LIBHEIF_STATIC: "1"
      LIBHEIF_SYS_STATIC: "1"
      # Suppress Node 24 punycode deprecation noise from upload-artifact and other JS actions.
      NODE_OPTIONS: --no-deprecation
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-09
          components: rustfmt, clippy, miri, rust-src, llvm-tools

      - name: Ensure required nightly components on pinned toolchain
        run: rustup component add rustfmt clippy miri rust-src llvm-tools --toolchain nightly-2026-08-09

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.39.0"

      - name: Just fmt check (early gate)
        id: fmt_check
        continue-on-error: true
        run: just fmt-check

      - name: Install MPC downloader bootstrap dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl meson ninja-build nasm

      - name: Build standalone media dependency installer
        run: rustc --edition 2024 crates/dev/src/bin/install_media_dependencies.rs -o "$RUNNER_TEMP/install_media_dependencies"

      - name: Install upstream media dependencies before compiling the MPC downloader
        env:
          MFB_SKIP_MPC_INSTALL: "1"
        run: '"$RUNNER_TEMP/install_media_dependencies"'

      - name: Download GNU MPC with mirror failover
        run: |
          archive="$RUNNER_TEMP/mpc-1.4.1.tar.xz"
          cargo run --locked -p dev --bin download_gnu_mpc -- "$archive"
          echo "MFB_MPC_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Install GNU MPC from the mirror-verified archive
        env:
          MFB_MPC_ONLY: "1"
        run: '"$RUNNER_TEMP/install_media_dependencies"'

      - name: Just read-only quality gate (after MPC/GMP/MPFR for gmp-mpfr-sys)
        id: fix_gate
        continue-on-error: true
        run: just fix-gate

      - name: Cache Cargo dependencies
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-health-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-health-

      - name: Install check_all CI tools (llvm-cov, hack, bloat, fuzz)
        run: cargo install cargo-llvm-cov cargo-hack cargo-bloat cargo-fuzz --locked

      - name: Repository health (check_all --ci, fail-fast)
        id: check_all
        continue-on-error: true
        run: |
          # SSOT: fmt, clippy_strict, check, CI tests, contract registry,
          # rustdoc -D warnings, llvm-cov LCOV, cargo fuzz smoke, cargo hack
          # feature matrix, cargo bloat — see check_all --ci
          # Exits on first required/optional failure (--ci sets Tracker.fail_fast).
          cargo run --locked -p dev --bin check_all -- --allow-non-nightly --ci --fuzz-smoke

      - name: Verify LCOV artifact (fail-closed)
        id: verify_lcov
        continue-on-error: true
        run: test -s lcov.info

      - name: Upload LCOV artifact
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-lcov-shared-utils
          path: lcov.info
          if-no-files-found: error

      - name: Check shared health-check outcomes
        if: always()
        run: |
          exit_code=0
          if [ "${{ steps.fmt_check.outcome }}" = "failure" ]; then
            echo "::error::just fmt-check failed"
            exit_code=1
          fi
          if [ "${{ steps.fix_gate.outcome }}" = "failure" ]; then
            echo "::error::just fix-gate failed"
            exit_code=1
          fi
          if [ "${{ steps.check_all.outcome }}" = "failure" ]; then
              echo "::error::check_all failed"
            exit_code=1
          fi
          if [ "${{ steps.verify_lcov.outcome }}" = "failure" ]; then
            echo "::error::lcov.info check failed or missing"
            exit_code=1
          fi
          exit $exit_code

  security-audit:
    name: "3 · Dependency Security Audit"
    needs: health-check
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: cargo audit --deny warnings

  nightly-release:
    name: Build & Publish Nightly
    if: github.ref == 'refs/heads/nightly' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.health-check.result == 'success' && needs.package-quality.result == 'success' && needs.security-audit.result == 'success' && needs.validation.result == 'success'
    needs:
      - validation
      - package-quality
      - health-check
      - security-audit
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/cd-nightly.yml
    secrets: inherit

  deep-audit:
    name: Deep Production Audit
    needs: security-audit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-09
          components: clippy, rustfmt, miri, rust-src, llvm-tools

      - name: Build standalone media dependency installer
        run: rustc --edition 2024 crates/dev/src/bin/install_media_dependencies.rs -o "$RUNNER_TEMP/install_media_dependencies"

      - name: Install upstream media and MPC dependencies
        run: '"$RUNNER_TEMP/install_media_dependencies"'

      - name: Install Audit Tools
        run: |
          cargo install cargo-hack cargo-bloat cargo-nextest --locked

      - name: Generate edge test media (gitignored fixtures)
        run: cargo run --locked -p dev --bin generate_test_media

      - name: Run Expensive Workspace Audit
        run: |
          # 运行 check_all 并启用昂贵检查：
          # --build: 验证 Release 编译
          # --fuzz-smoke: 验证并短跑所有 Fuzz 目标
          # (不传 --no-expensive 默认开启 cargo hack feature matrix)
          cargo run --locked -p dev --bin check_all -- --allow-non-nightly --build --fuzz-smoke
