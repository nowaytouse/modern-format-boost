[workspace]
members = [
  "crates/vid",
  "crates/img",
  "crates/foundation",
  "crates/jxl_import_doctor",
  "crates/dev",
  "crates/dev/src/fuzz",
]
exclude = ["crates/dev/src/dispatch2", "crates/dev/src/vue/src-tauri"]
resolver = "2"

[workspace.lints.rust]
internal_features = "allow"
incomplete_features = "allow"
unused_must_use = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
# Workspace default: deny (stricter than `warn` + `cargo clippy -- -D warnings` alone).
# Ultra-strict CI: `cargo run --locked -p dev --bin clippy_strict` (explicit pedantic+nursery deny on CLI).
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
cast_possible_wrap = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
# Pedantic `too_many_lines` (100 LOC): legacy foundation analyzers — lib.rs crate allow until split.
too_many_lines = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
option_if_let_else = { level = "allow", priority = 1 }
manual_let_else = { level = "allow", priority = 1 }
question_mark = { level = "allow", priority = 1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = "deny"


[workspace.package]
version = "0.11.3"
edition = "2024"
license = "MIT"
authors = ["Modern Format Boost Contributors"]
repository = "https://github.com/nowaytouse/modern-format-boost"
readme = "README.md"
keywords = ["media", "video", "image", "conversion", "performance"]
categories = ["multimedia", "command-line-utilities"]

[patch.crates-io]
# Override crates.io with git sources for dependencies that require upstream fixes.
# Use exact commits from Cargo.lock to ensure proc-macro companions are resolved.
anyhow = { git = "https://github.com/dtolnay/anyhow" }
thiserror = { git = "https://github.com/dtolnay/thiserror", rev = "ec42ea70852f8db43e971700d1ccc184957d1b32" }
thiserror-impl = { git = "https://github.com/dtolnay/thiserror", rev = "ec42ea70852f8db43e971700d1ccc184957d1b32" }
tracing = { git = "https://github.com/tokio-rs/tracing", rev = "d9d4c542de10f5d3a711b7a45ffe450fd0666437" }
tracing-attributes = { git = "https://github.com/tokio-rs/tracing", rev = "d9d4c542de10f5d3a711b7a45ffe450fd0666437" }
tracing-subscriber = { git = "https://github.com/tokio-rs/tracing", rev = "d9d4c542de10f5d3a711b7a45ffe450fd0666437" }
tracing-appender = { git = "https://github.com/tokio-rs/tracing", rev = "d9d4c542de10f5d3a711b7a45ffe450fd0666437" }
clap = { git = "https://github.com/clap-rs/clap" }
indicatif = { git = "https://github.com/console-rs/indicatif" }
walkdir = { git = "https://github.com/BurntSushi/walkdir" }
filetime = { git = "https://github.com/alexcrichton/filetime" }
xattr = { git = "https://github.com/Stebalien/xattr" }
which = { git = "https://github.com/harryfei/which-rs" }
log = { git = "https://github.com/rust-lang/log" }
console = { git = "https://github.com/console-rs/console" }
chrono = { git = "https://github.com/chronotope/chrono" }
image = { git = "https://github.com/image-rs/image" }
libheif-rs = { git = "https://github.com/Cykooz/libheif-rs" }
tempfile = { git = "https://github.com/Stebalien/tempfile" }
proptest = { git = "https://github.com/proptest-rs/proptest" }
insta = { git = "https://github.com/mitsuhiko/insta" }
flate2 = { git = "https://github.com/rust-lang/flate2-rs" }
ctrlc = { git = "https://github.com/Detegr/rust-ctrlc" }
bitflags = { git = "https://github.com/bitflags/bitflags" }
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3" }
rmp-serde = { git = "https://github.com/3Hren/msgpack-rust" }
pgvector = { git = "https://github.com/pgvector/pgvector-rust" }
infer = { git = "https://github.com/bojand/infer" }
crc32fast = { git = "https://github.com/srijs/rust-crc32fast" }
quick-xml = { git = "https://github.com/tafia/quick-xml" }
exr = { git = "https://github.com/johannesvollmer/exrs" }
jpegxl-rs = { git = "https://github.com/inflation/jpegxl-rs" }
rug = { git = "https://gitlab.com/tspiteri/rug" }
paste = { git = "https://github.com/dtolnay/paste" }
zerocopy = { git = "https://github.com/google/zerocopy", rev = "3b29d25ae1d7bcb12321eef9016721612c6724f7" }
zerocopy-derive = { git = "https://github.com/google/zerocopy", rev = "3b29d25ae1d7bcb12321eef9016721612c6724f7" }
profiling = { git = "https://github.com/aclysma/profiling", rev = "da44bd1c5497c665c0f00e5d70594fc14d390b4b" }
profiling-procmacros = { git = "https://github.com/aclysma/profiling", rev = "da44bd1c5497c665c0f00e5d70594fc14d390b4b" }
# equator 0.4.2 not available in git; use crates.io version

[workspace.dependencies]
# Core error_handling>
# Core error handling
anyhow = { git = "https://github.com/dtolnay/anyhow" }
thiserror = { git = "https://github.com/dtolnay/thiserror", rev = "ec42ea70852f8db43e971700d1ccc184957d1b32" }

# Logging and tracing
tracing = { git = "https://github.com/tokio-rs/tracing", rev = "d9d4c542de10f5d3a711b7a45ffe450fd0666437" }
tracing-subscriber = { git = "https://github.com/tokio-rs/tracing", rev = "d9d4c542de10f5d3a711b7a45ffe450fd0666437", features = [
  "fmt",
  "env-filter",
  "json",
] }
tracing-appender = { git = "https://github.com/tokio-rs/tracing", rev = "d9d4c542de10f5d3a711b7a45ffe450fd0666437" }

# CLI
clap = { git = "https://github.com/clap-rs/clap", features = [
  "derive",
  "cargo",
], version = ">= 4.0" }

# Serialization
serde = { features = ["derive"], version = ">= 1.0" }
serde_json = ">= 1.0"

# Parallelism
rayon = ">= 1.0"

# Progress indicators
indicatif = { git = "https://github.com/console-rs/indicatif", features = [
  "rayon",
], version = ">= 0.18" }

# File system utilities
walkdir = { git = "https://github.com/BurntSushi/walkdir" }
filetime = { git = "https://github.com/alexcrichton/filetime" }
libc = ">= 0.2"
xattr = { git = "https://github.com/Stebalien/xattr" }

# System utilities
which = { git = "https://github.com/harryfei/which-rs" }
log = { git = "https://github.com/rust-lang/log" }

# Terminal
console = { git = "https://github.com/console-rs/console" }
chrono = { git = "https://github.com/chronotope/chrono", features = [
  "serde",
], version = ">= 0.4" }

# Image processing
image = { git = "https://github.com/image-rs/image", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
  "tiff",
  "avif",
] }
libheif-rs = { git = "https://github.com/Cykooz/libheif-rs", features = [
  "v1_21",
], version = ">= 2.0" }
libavif = { version = "0.14", features = ["codec-dav1d"] }

# Testing and compression
tempfile = { git = "https://github.com/Stebalien/tempfile" }
proptest = { git = "https://github.com/proptest-rs/proptest" }
insta = { git = "https://github.com/mitsuhiko/insta" }
flate2 = { git = "https://github.com/rust-lang/flate2-rs" }

# Signal handling
ctrlc = { git = "https://github.com/Detegr/rust-ctrlc" }

# Flags and Enums
bitflags = { git = "https://github.com/bitflags/bitflags", features = [
  "serde",
], version = ">= 2.0" }

# Database and Caching
rusqlite = { version = "0.40", features = ["bundled"] }
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3" }
rmp-serde = { git = "https://github.com/3Hren/msgpack-rust" }
postgres = { features = ["with-serde_json-1"], version = ">= 0.19" }
pgvector = { git = "https://github.com/pgvector/pgvector-rust", features = [
  "postgres",
], version = ">= 0.4" }

# File type detection
infer = { git = "https://github.com/bojand/infer" }
crc32fast = { git = "https://github.com/srijs/rust-crc32fast" }
quick-xml = { git = "https://github.com/tafia/quick-xml" }
exr = { git = "https://github.com/johannesvollmer/exrs" }
jpegxl-rs = { git = "https://github.com/inflation/jpegxl-rs", default-features = false, features = [
  "vendored",
] }

# Precision arithmetic
rug = { git = "https://gitlab.com/tspiteri/rug" }
gmp-mpfr-sys = ">= 1.0"


foundation = { path = "crates/foundation" }
img = { path = "crates/img" }
vid = { path = "crates/vid" }


[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = "symbols"
overflow-checks = true

[profile.dev]
opt-level = 0
