[workspace]
members = [
    "crates/vid",
    "crates/img",
    "crates/shared_utils",
    "crates/dev",
    "crates/dev/fuzz"
]
resolver = "2"

[workspace.lints.clippy]

[workspace.package]
version = "0.11.2"
edition = "2021"
license = "MIT"
authors = ["Modern Format Boost Contributors"]

[workspace.dependencies]
# Core error handling
anyhow    = "1.0.102"
thiserror = "2.0.18"

# Logging and tracing
tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "json"] }
tracing-appender   = "0.2.5"

# CLI
clap = { version = "4.6.1", features = ["derive", "cargo"] }

# Serialization
serde      = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Parallelism
rayon = "1.12.0"

# Progress indicators
indicatif = { version = "0.18.4", features = ["rayon"] }

# File system utilities
walkdir  = "2.5.0"
filetime = "0.2.27"
libc     = "0.2.185"
xattr    = "1.6.1"

# System utilities
which = "8.0.2"
log   = "0.4.29"

# Terminal
console = "0.16.3"
chrono  = { version = "0.4.44", features = ["serde"] }

# Image processing
image       = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "avif"] }
libheif-rs  = { version = "2.7.0", features = ["v1_21"] }
mp4parse    = "0.14.0"

# Testing and compression
tempfile = "3.27.0"
proptest = "1.11.0"
insta    = "1.47.2"
criterion = "0.5.1"
flate2   = "1.1.9"

# Signal handling
ctrlc = "3.5.2"

# Flags and Enums
bitflags = { version = "2.8.0", features = ["serde"] }

# Randomization
rand = "0.10"

# Database and Caching
rusqlite = { version = "0.33.0", features = ["bundled"] }
blake3   = "1.8.4"
rmp-serde = "1.3.1"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
pgvector = { version = "0.4", features = ["postgres"] }

# File type detection
infer = "0.16"
crc32fast = "1.5.0"
quick-xml = "0.31.0"
exr = "1.74.0"
jpegxl-rs = { version = "0.12", default-features = false, features = ["vendored"] }

# Precision arithmetic
rug = "1.30.0"

shared_utils = { path = "crates/shared_utils" }
img = { path = "crates/img" }
vid = { path = "crates/vid" }



[profile.release]
lto            = true
opt-level      = 3
codegen-units  = 1
strip          = "symbols"

[profile.dev]
opt-level = 0


[patch.crates-io]
# Core libs from GitHub
anyhow = { git = "https://github.com/dtolnay/anyhow.git" }
thiserror = { git = "https://github.com/dtolnay/thiserror.git" }
tracing = { git = "https://github.com/tokio-rs/tracing.git" }
tracing-core = { git = "https://github.com/tokio-rs/tracing.git" }
tracing-attributes = { git = "https://github.com/tokio-rs/tracing.git" }
serde = { git = "https://github.com/serde-rs/serde.git" }
serde_core = { git = "https://github.com/serde-rs/serde.git" }
serde_derive = { git = "https://github.com/serde-rs/serde.git" }
serde_json = { git = "https://github.com/serde-rs/json.git" }
rayon = { git = "https://github.com/rayon-rs/rayon.git" }
rayon-core = { git = "https://github.com/rayon-rs/rayon.git" }
image = { git = "https://github.com/image-rs/image.git" }
clap = { git = "https://github.com/clap-rs/clap.git" }
indicatif = { git = "https://github.com/console-rs/indicatif.git" }

# Media & Build libs
libheif-sys = { git = "https://github.com/Cykooz/libheif-sys.git", rev = "fd2073e1a3211a17a5480f5c6a636384f7680b74" }
libheif-rs = { git = "https://github.com/Cykooz/libheif-rs.git", rev = "0f614ab5f6677a57af4a8aa6e4f43b69e937ef13" }

# Misc libs
walkdir = { git = "https://github.com/BurntSushi/walkdir.git" }
filetime = { git = "https://github.com/alexcrichton/filetime.git" }
libc = { git = "https://github.com/rust-lang/libc.git" }
log = { git = "https://github.com/rust-lang/log.git" }
console = { git = "https://github.com/console-rs/console.git" }
chrono = { git = "https://github.com/chronotope/chrono.git" }
tempfile = { git = "https://github.com/Stebalien/tempfile.git" }
ctrlc = { git = "https://github.com/Detegr/rust-ctrlc.git" }
flate2 = { git = "https://github.com/rust-lang/flate2-rs.git" }
rmp-serde = { git = "https://github.com/3Hren/msgpack-rust.git" }
