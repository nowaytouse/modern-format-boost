serde_json = { git = "https://github.com/serde-rs/json" }
image = { git = "https://github.com/image-rs/image" }
mp4parse = { git = "https://github.com/mozilla/mp4parse-rust" }
rusqlite = { git = "https://github.com/rusqlite/rusqlite" }
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3" }
rayon = { git = "https://github.com/rayon-rs/rayon" }
clap = { git = "https://github.com/clap-rs/clap" }
tracing = { git = "https://github.com/tokio-rs/tracing" }
tracing-subscriber = { git = "https://github.com/tokio-rs/tracing" }
tracing-appender = { git = "https://github.com/tokio-rs/tracing" }
indicatif = { git = "https://github.com/console-rs/indicatif" }
console = { git = "https://github.com/console-rs/console" }
chrono = { git = "https://github.com/chronotope/chrono" }
walkdir = { git = "https://github.com/BurntSushi/walkdir" }
filetime = { git = "https://github.com/alexcrichton/filetime" }
libc = { git = "https://github.com/rust-lang/libc" }
which = { git = "https://github.com/harryfei/which-rs" }
log = { git = "https://github.com/rust-lang/log" }
tempfile = { git = "https://github.com/Stebalien/tempfile" }
proptest = { git = "https://github.com/proptest-rs/proptest" }
flate2 = { git = "https://github.com/rust-lang/flate2-rs" }
ctrlc = { git = "https://github.com/Detegr/rust-ctrlc" }
rmp-serde = { git = "https://github.com/3Hren/msgpack-rust" }
infer = { git = "https://github.com/bojand/infer" }
xattr = { git = "https://github.com/Stebalien/xattr" }
libheif-rs = { git = "https://github.com/Cykooz/libheif-rs" }
crc32fast = { git = "https://github.com/srijs/rust-crc32fast" }
rayon-core = { git = "https://github.com/rayon-rs/rayon" }
tracing-core = { git = "https://github.com/tokio-rs/tracing" }
serde_core = { git = "https://github.com/serde-rs/serde" }
serde_derive = { git = "https://github.com/serde-rs/serde" }
thiserror-impl = { git = "https://github.com/dtolnay/thiserror" }

# Force all transitive dependencies to use GitHub nightly (eliminate duplicates)
getrandom = { git = "https://github.com/rust-random/getrandom" }
hashbrown = { git = "https://github.com/rust-lang/hashbrown" }
indexmap = { git = "https://github.com/indexmap-rs/indexmap" }
syn = { git = "https://github.com/dtolnay/syn" }
quote = { git = "https://github.com/dtolnay/quote" }
proc-macro2 = { git = "https://github.com/dtolnay/proc-macro2" }


[profile.release]
lto            = true
opt-level      = 3
codegen-units  = 1
strip          = "symbols"

[profile.dev]
opt-level = 0
