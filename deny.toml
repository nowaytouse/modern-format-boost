# Cargo Deny configuration for modern_format_boost

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
# MIT, Apache-2.0, and Zlib are standard and allowed for this project
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Zlib",
  # Common media/image dependency licenses
  "BSD-2-Clause",
  "BSD-3-Clause",
  "NCSA",
  "Unicode-3.0",
  "GPL-3.0-or-later",
  "LGPL-3.0-or-later",
  "ISC",
  "CC0-1.0",
  # Required by jpeg-encoder through image's JPEG support.
  "IJG",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "gmp-mpfr-sys"
expression = "LGPL-3.0-or-later"
license-files = [{ path = "LICENSE-LGPL.md", hash = 986959994 }]

[[licenses.clarify]]
crate = "rug"
expression = "LGPL-3.0-or-later"
license-files = [{ path = "LICENSE-LGPL.md", hash = 986959994 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
skip = [
  { crate = "bitstream-io", reason = "libavif/rav1e and current codec dependencies require separate major lines" },
  { crate = "built", reason = "libavif/rav1e and current codec dependencies require separate minor lines" },
  { crate = "cfg-expr", reason = "system-deps 6 and 7 require separate cfg-expr lines" },
  { crate = "fallible-iterator", reason = "postgres and rusqlite currently require different major/minor lines" },
  { crate = "getrandom", reason = "registry 0.3 and git 0.4 are required by independent upstream dependency trees" },
  { crate = "hashbrown", reason = "rusqlite transitively pulls both registry and git lines" },
  { crate = "itertools", reason = "libavif and image/ravif require separate codec dependency lines" },
  { crate = "miniz_oxide", reason = "image and flate2 currently require separate upstream lines" },
  { crate = "quick-error", reason = "transitive dependencies currently require separate quick-error lines" },
  { crate = "r-efi", reason = "getrandom/WASI dependency trees currently require separate source lines" },
  { crate = "rand", reason = "codec and database/proptest dependency trees currently require separate lines" },
  { crate = "rand_chacha", reason = "rand and proptest dependency trees currently require separate lines" },
  { crate = "rand_core", reason = "rand 0.9 and 0.10 dependency trees currently require separate lines" },
  { crate = "rav1e", reason = "libavif and image/ravif currently require separate rav1e lines" },
  { crate = "serde_spanned", reason = "toml 0.8 and 1.x require separate serde_spanned lines" },
  { crate = "syn", reason = "current proc-macro dependency trees require syn 2 and syn 3" },
  { crate = "system-deps", reason = "native codec bindings currently require system-deps 6 and 7" },
  { crate = "target-lexicon", reason = "system-deps 6 and 7 require separate target-lexicon lines" },
  { crate = "thiserror", reason = "upstream dependencies still require thiserror 1 alongside project nightly thiserror 2" },
  { crate = "thiserror-impl", reason = "upstream dependencies still require thiserror-impl 1 and 2" },
  { crate = "toml", reason = "build dependencies currently require toml 0.8 and 1.x" },
  { crate = "toml_datetime", reason = "toml 0.8 and 1.x require separate datetime lines" },
  { crate = "wasi", reason = "tokio and wasite dependency trees currently require separate WASI lines" },
  { crate = "windows-sys", reason = "notify and current platform dependencies require separate Windows API lines" },
  { crate = "winnow", reason = "toml 0.8 and 1.x require separate parser lines" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/image-rs/image",
  "https://github.com/BLAKE3-team/BLAKE3",
  "https://github.com/dtolnay/anyhow",
  "https://github.com/dtolnay/thiserror",
  "https://github.com/tokio-rs/tracing",
  "https://github.com/clap-rs/clap",
  "https://github.com/console-rs/indicatif",
  "https://github.com/BurntSushi/walkdir",
  "https://github.com/alexcrichton/filetime",
  "https://github.com/Stebalien/xattr",
  "https://github.com/harryfei/which-rs",
  "https://github.com/rust-lang/log",
  "https://github.com/console-rs/console",
  "https://github.com/chronotope/chrono",
  "https://github.com/Cykooz/libheif-rs",
  "https://github.com/Stebalien/tempfile",
  "https://github.com/proptest-rs/proptest",
  "https://github.com/mitsuhiko/insta",
  "https://github.com/rust-lang/flate2-rs",
  "https://github.com/Detegr/rust-ctrlc",
  "https://github.com/3Hren/msgpack-rust",
  "https://github.com/bojand/infer",
  "https://github.com/srijs/rust-crc32fast",
  "https://github.com/tafia/quick-xml",
  "https://github.com/johannesvollmer/exrs",
  "https://github.com/bitflags/bitflags",
  "https://github.com/inflation/jpegxl-rs",
