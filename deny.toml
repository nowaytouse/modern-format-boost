# Cargo Deny configuration for modern_format_boost

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # paste - no longer maintained (transitive dependency of image/rav1e in nightly)
    "RUSTSEC-2024-0436",
]

[licenses]
# MIT, Apache-2.0, and Zlib are standard and allowed for this project
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    # Common media/image dependency licenses
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "NCSA",
    "IJG",
    "Unicode-3.0",
    "GPL-3.0-or-later",
    "LGPL-3.0-or-later",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/image-rs/image",
    "https://github.com/mozilla/mp4parse-rust",
    "https://github.com/rusqlite/rusqlite",
    "https://github.com/BLAKE3-team/BLAKE3",
    "https://github.com/rust-random/getrandom",
    "https://github.com/rust-lang/hashbrown",
    "https://github.com/dtolnay/anyhow",
    "https://github.com/dtolnay/thiserror",
    "https://github.com/tokio-rs/tracing",
    "https://github.com/clap-rs/clap",
    "https://github.com/serde-rs/serde",
