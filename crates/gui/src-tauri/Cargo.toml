[package]
name = "mfb_launcher"
version = "0.0.1"
description = "A Tauri App"
authors = ["nyamilko"]
edition = "2021"
license = "MIT"
repository = "https://github.com/nowaytouse/modern-format-boost"
readme = "../../../README.md"
keywords = ["media", "video", "image", "conversion", "performance"]
categories = ["multimedia", "command-line-utilities"]

[workspace]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mfb_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = ">= 2.0", features = [] }

[dependencies]
tauri = { version = ">= 2.0", features = ["wry"] }
tauri-plugin-opener = ">= 2.0"
serde = { features = ["derive"], version = ">= 1.0" }
serde_json = ">= 1.0"
tauri-plugin-dialog = ">= 2.0.0"
