[package]
name = "shared_utils"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared utilities for modern_format_boost tools"

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
insta    = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "quality_benches"
harness = false

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
indicatif = { workspace = true }
console = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = { workspace = true }
libc = { workspace = true }
xattr = { workspace = true }
filetime = { workspace = true }
log = { workspace = true }
which = { workspace = true }
tempfile = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
libheif-rs = { workspace = true }
jpegxl-rs = { version = "0.14", features = ["vendored"] }
flate2 = { workspace = true }
ctrlc = { workspace = true }
blake3 = { workspace = true }
postgres = { workspace = true }
pgvector = { workspace = true }
rmp-serde = { workspace = true }
crc32fast = { workspace = true }
infer = { workspace = true }
quick-xml = { workspace = true }
exr = { workspace = true }
proptest = { workspace = true }
serial_test = "3.1.1"
jpegxl-sys = "0.12.1"
arbitrary = { version = "1.3", features = ["derive"], optional = true }

[[bin]]
name = "train_knn"
path = "src/bin/train_knn.rs"

[[bin]]
name = "recompute_stats"
path = "src/bin/recompute_stats.rs"

[[bin]]
name = "train_quality"
path = "src/bin/train_quality.rs"

[features]
default = ["v1_21"]
v1_21 = ["libheif-rs/v1_21"]
fuzzing = ["dep:arbitrary"]
