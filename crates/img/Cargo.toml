[package]
name = "img"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "High-performance image format converter and analyzer"

[dependencies]
rug = { workspace = true, optional = true }
gmp-mpfr-sys = { workspace = true, optional = true }

clap = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
rayon = { workspace = true }
anyhow = { workspace = true }
shared_utils = { path = "../shared_utils", default-features = false }
vid = { path = "../vid", default-features = false }
tempfile = { workspace = true }
console = { workspace = true }
tracing = { workspace = true }
bitflags = { workspace = true }

[features]
default = ["v1_21", "shared_utils/default", "vid/default", "high-precision"]
v1_21 = ["shared_utils/v1_21"]
high-precision = ["dep:rug", "dep:gmp-mpfr-sys", "shared_utils/high-precision", "vid/high-precision"]
system-gmp = ["dep:gmp-mpfr-sys", "gmp-mpfr-sys/use-system-libs", "shared_utils/system-gmp", "vid/system-gmp"]

[lints]
workspace = true
