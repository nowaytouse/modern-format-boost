# =============================================================================
# Modern Format Boost - Cargo Compilation & Optimization Configuration
# =============================================================================
# Documentation: https://doc.rust-lang.org/cargo/reference/config.html
# =============================================================================

# -----------------------------------------------------------------------------
# Build Configuration
# -----------------------------------------------------------------------------
[build]
# Enable overflow checks by default for all targets
rustflags = ["-C", "overflow-checks=on"]


[env]
MACOSX_DEPLOYMENT_TARGET = "26.0"
CMAKE_PREFIX_PATH = "/opt/homebrew/opt/aom:/opt/homebrew/opt/libjpeg-turbo:/opt/homebrew"
C_INCLUDE_PATH = "/opt/homebrew/include:/usr/local/include"
CPLUS_INCLUDE_PATH = "/opt/homebrew/include:/usr/local/include"
LIBRARY_PATH = "/opt/homebrew/lib:/usr/local/lib"
PKG_CONFIG_PATH = "/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig"

# macOS ARM64 (Apple Silicon) optimizations
[target.aarch64-apple-darwin]
rustflags = [
  "-C",
  "overflow-checks=on",
  # Fix libstdc++ linking issue on macOS (use libc++ instead)
  "-L",
  "crates/.modern_format_boost/.tmp_lib",
  "-C",
  "link-arg=-lc++",
]
rustdocflags = ["-L", "crates/.modern_format_boost/.tmp_lib"]

# macOS x86_64 (Intel) optimizations
[target.x86_64-apple-darwin]
rustflags = [
  "-C",
  "overflow-checks=on",
  # Fix libstdc++ linking issue on macOS (use libc++ instead)
  "-L",
  "crates/.modern_format_boost/.tmp_lib",
  # Homebrew paths for x86_64 (Intel) - Standard and specific overrides
  "-L",
  "/usr/local/lib",
  "-C",
  "link-arg=-lc++",
]
rustdocflags = ["-L", "crates/.modern_format_boost/.tmp_lib"]

# -----------------------------------------------------------------------------
# Incremental Compilation Optimizations
# -----------------------------------------------------------------------------
[profile.dev]
# Incremental compilation enabled by default for fast iteration
# Note: If using sccache, incremental compilation should be disabled (conflicts)
# incremental = false

# Optimization Level:
# 0 = No optimizations (fastest build)
# 1 = Basic optimizations (recommended for balanced dev)
# 2 = High optimizations
# 3 = Maximal optimizations
# "s" = Optimize for size
# "z" = Aggressive size optimization
opt-level = 1

# Debug Information:
# 0/none = No debug info
# 1/limited = Line tables only (faster build)
# 2/full = Full debug symbols (default)
debug = 2

# Enable runtime assertions for development
debug-assertions = true

# -----------------------------------------------------------------------------
# Development Environment - Fast Compilation Profile
# -----------------------------------------------------------------------------
[profile.dev-fast]
inherits = "dev"

# Completely disable optimizations for minimum wait time
opt-level = 0

# Strip debug info to speed up linking
debug = 0

# -----------------------------------------------------------------------------
# Test Configuration - Balanced speed for testing
# -----------------------------------------------------------------------------
[profile.test]
# Tests benefit from moderate optimization to reflect real-world performance
opt-level = 2
debug = true

# -----------------------------------------------------------------------------
# Release Configuration - Production Grade Optimization
# -----------------------------------------------------------------------------
[profile.release]
# Link-Time Optimization (LTO)
# Thin LTO provides similar benefits to 'fat' LTO with significantly faster build times.
lto = "thin"

# Maximal optimization level
opt-level = 3

# Single codegen unit allows for maximal cross-function optimization but slows down build
codegen-units = 1

# Abort on panic (reduces binary size and improves performance where unwinding isn't needed)
panic = "abort"

# Strip all symbols to minimize binary footprint (essential for CLI distribution)
strip = "symbols"

# -----------------------------------------------------------------------------
# Profiling Configuration - Used for performance tuning
# -----------------------------------------------------------------------------
[profile.profiling]
inherits = "release"

# Retain debug info for meaningful flamegraphs/profiler output
debug = true

# Disable LTO to speed up iterative profiling builds
lto = false

# Multiple codegen units for faster compilation
codegen-units = 16

# -----------------------------------------------------------------------------
# Per-Package Optimizations
# -----------------------------------------------------------------------------
# Always optimize heavy math/compression dependencies even in dev mode
[profile.dev.package.image]
opt-level = 2

[profile.dev.package.num-rational]
opt-level = 3

# -----------------------------------------------------------------------------
# Environment & Parallelism
# -----------------------------------------------------------------------------
[term]
# Ensure colorful output
verbose = false
color = "always"

[net]
# Optimize network requests for registry updates
retry = 3
git-fetch-with-cli = true

# Strict Clippy (see scripts/clippy_strict.py and clippy.toml)
[alias]
clippy-strict = "clippy --workspace --all-targets --all-features -- -D warnings -W clippy::pedantic -W clippy::nursery -W clippy::cargo -W unreachable_pub -W dead_code -A clippy::multiple_crate_versions"
